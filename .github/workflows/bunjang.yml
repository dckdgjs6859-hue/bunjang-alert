# 번개장터 알림을 GitHub 서버에서 10분마다 자동 실행
name: bunjang-alert

on:
  schedule:
    - cron: "*/10 * * * *"   # 10분마다 (GitHub 사정으로 몇 분씩 늦어질 수 있음)
  workflow_dispatch:          # 수동 실행 버튼

permissions:
  contents: write             # 본 상품 목록(bunjang_seen.json) 저장용

concurrency:
  group: bunjang-alert
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install
        run: pip install requests

      - name: Check Bunjang
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_ONCE: "1"
        timeout-minutes: 3
        run: python -u bunjang_alert.py

      - name: Save seen list
        if: always()
        run: |
          git config user.name "bunjang-bot"
          git config user.email "bunjang-bot@users.noreply.github.com"
          git add bunjang_seen.json || true
          git diff --cached --quiet || git commit -m "update seen list"
          git push || true
